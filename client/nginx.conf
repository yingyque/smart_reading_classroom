server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传限制（文献 30MB；聊天附件 50MB，留余量取 55m）
    client_max_body_size 55m;

    # REST API 反向代理到后端
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO（WebSocket）反向代理
    location /socket.io/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # .mjs 必须以 JS MIME 返回，否则浏览器拒绝作为 ES module 加载（pdf.js worker 依赖）
    # 镜像自带 mime.types 无 mjs 条目，会回退为 application/octet-stream
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    # SPA 路由回退；index.html 不缓存（静态资源文件名带 hash 可放心长缓存），
    # 否则发版后浏览器可能仍加载旧 bundle，出现"已部署但看不到新功能"
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
}
