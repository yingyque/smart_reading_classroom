services:
  db:
    image: postgres:16-alpine
    container_name: src-db
    environment:
      POSTGRES_USER: smart_reading
      POSTGRES_PASSWORD: src_pg_2026_secret
      POSTGRES_DB: smart_reading
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_reading -d smart_reading"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    build: ./server
    container_name: src-server
    environment:
      PORT: 4000
      # 前端访问地址（CORS 白名单），逗号分隔可配多个
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-insecure-secret}
      # PostgreSQL 连接串
      DATABASE_URL: postgresql://smart_reading:src_pg_2026_secret@db:5432/smart_reading
      # ===== AI 接入（OpenAI 兼容接口，不配置也可运行）=====
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_CONTEXT_CHAR_LIMIT: ${AI_CONTEXT_CHAR_LIMIT:-6000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    volumes:
      - server-uploads:/app/uploads
      # 管理学生 AI 工作台容器
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 学生 AI 工作台镜像（仅构建，不作为服务启动；由 server 动态创建每学生容器）
  workspace:
    image: smart-reading-workspace:latest
    build: ./workspace-image
    profiles: ["build-only"]
    restart: "no"

  client:
    build: ./client
    container_name: src-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pg-data:
  server-uploads:
